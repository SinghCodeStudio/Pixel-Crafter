<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignIn</title>
  <link rel="stylesheet" href="../assets/css/signin.css">
</head>
<body>
  <h2>OFFICE BOTICS</h2>
<div class="container" id="container">
	<div class="form-container sign-up-container">
		<form action="#">
			<h1>Create Account</h1>
			<div class="social-container">
        <a href="https://www.facebook.com/login.php" target="_blank" class="social">
          <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="Facebook" class="Facebook">
      </a>
      
      <!-- Google Login -->
      <a href="https://accounts.google.com/" target="_blank" class="social">
        <img src="../Images/Google.png" alt="Google" class="Google">
    </a>      
      
      <!-- LinkedIn Login -->
      <a href="https://www.linkedin.com/login" target="_blank" class="social">
          <img src="https://upload.wikimedia.org/wikipedia/commons/c/ca/LinkedIn_logo_initials.png" alt="LinkedIn" class="Linkedin">
      </a>
			</div>
			<span>or use your email for registration</span>
			<input type="text" placeholder="Name" />
			<input type="email" placeholder="Email" />
			<input type="password" placeholder="Password" />
			<button>Sign Up</button>
		</form>
	</div>
	<div class="form-container sign-in-container">
		<form action="#">
			<h1>Sign in</h1>
			<div class="social-container">
        <!-- Facebook Login -->
        <a href="https://www.facebook.com/login.php" target="_blank" class="social">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="Facebook" class="Facebook">
        </a>
        
        <!-- Google Login -->
        <a href="https://accounts.google.com/" target="_blank" class="social">
          <img src="../Images/Google.png" alt="Google" class="Google">
      </a>      
        
        <!-- LinkedIn Login -->
        <a href="https://www.linkedin.com/login" target="_blank" class="social">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/ca/LinkedIn_logo_initials.png" alt="LinkedIn" class="Linkedin">
        </a>
    </div>
			<span>or use your account</span>
			<input type="email" placeholder="Email" />
			<input type="password" placeholder="Password" />
			<input type="password" placeholder="Otp" />
			<a href="#">Forgot your password?</a>
			<button>Sign In</button>
		</form>
	</div>
	<div class="overlay-container">
		<div class="overlay">
			<div class="overlay-panel overlay-left">
				<h1>Welcome Back!</h1>
				<p>To keep connected with us please login with your personal info</p>
				<button class="ghost" id="signIn">Sign In</button>
			</div>
			<div class="overlay-panel overlay-right">
				<h1>Hello, Friend!</h1>
				<p>Enter your personal details and start journey with us</p>
				<button class="ghost" id="signUp">Sign Up</button>
			</div>
		</div>
	</div>
</div>

<script src="./signin.js"></script>
</body>
</html>
